<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Follower Count</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap');
    * { box-sizing: border-box; }
    html, body {
      margin: 0; width: 100%; min-height: 100%;
      background: transparent;
    }
    body {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      color: #000; font-family: 'Outfit', Arial, sans-serif;
    }
    .counter {
      display: flex; flex-direction: column; align-items: center;
      gap: 13px; padding: 8px; background: transparent;
    }
    .number {
      font-size: 76px; font-weight: 500; line-height: 1;
      letter-spacing: 1px; font-variant-numeric: tabular-nums;
    }
    .username { font-size: 15px; color: #555; line-height: 1.2; }
    .label { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 500; }
    .custom-emoji { display: block; width: 25px; height: 25px; }
    .sparkle { width: 23px; height: 23px; }
    .status { font-size: 10px; color: #777; min-height: 12px; }
  </style>
</head>
<body>
  <main class="counter">
    <div class="number" id="count">—</div>
    <div class="username">@thijmenx.official</div>
    <div class="label">
      <svg class="custom-emoji sparkle" viewBox="0 0 32 32" aria-label="sparkle">
        <path d="M16 1.5 C18.1 10.1 21.9 13.9 30.5 16 C21.9 18.1 18.1 21.9 16 30.5 C13.9 21.9 10.1 18.1 1.5 16 C10.1 13.9 13.9 10.1 16 1.5Z" fill="#FFD84D" stroke="#171717" stroke-width="1.6" stroke-linejoin="round"/>
        <circle cx="23.5" cy="7" r="2" fill="#FF9F43"/>
      </svg>
      <span>Followers</span>
      <svg class="custom-emoji" viewBox="0 0 40 32" aria-label="followers">
        <circle cx="13" cy="9" r="6" fill="#8CC7FF" stroke="#171717" stroke-width="1.7"/>
        <circle cx="27" cy="9" r="6" fill="#FFB6C8" stroke="#171717" stroke-width="1.7"/>
        <path d="M2.5 28 C2.5 19.5 6.5 15.5 13 15.5 C19.5 15.5 23.5 19.5 23.5 28Z" fill="#8CC7FF" stroke="#171717" stroke-width="1.7" stroke-linejoin="round"/>
        <path d="M16.5 28 C16.5 19.5 20.5 15.5 27 15.5 C33.5 15.5 37.5 19.5 37.5 28Z" fill="#FFB6C8" stroke="#171717" stroke-width="1.7" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="status" id="status">Volgersaantal ophalen…</div>
  </main>

  <script>
    const username = "thijmenx.official";
    const refreshInterval = 2_000;
    const profileUrl = `https://www.tiktok.com/@${username}`;
    const apiUrl = `https://pulse.walls.sh/profile?url=${encodeURIComponent(profileUrl)}`;

    async function updateFollowers() {
      const status = document.getElementById("status");
      try {
        const response = await fetch(apiUrl, { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`De gegevensdienst gaf HTTP ${response.status}`);
        }

        const data = await response.json();
        const followers = data.followers ?? data.data?.followers;

        if (typeof followers !== "number") {
          throw new Error(data.error || "Geen volgersaantal in het API-antwoord");
        }

        document.getElementById("count").textContent =
          new Intl.NumberFormat("nl-NL").format(followers);
        status.textContent = "Automatisch bijgewerkt · elke 2 sec.";
      } catch (error) {
        console.error("TikTok follower counter:", error);
        if (error instanceof TypeError && error.message === "Failed to fetch") {
          status.textContent = "Verbinding geblokkeerd (CORS/netwerk).";
        } else {
          status.textContent = error.message;
        }
      }
    }

    updateFollowers();
    setInterval(updateFollowers, refreshInterval);
  </script>
</body>
</html>
